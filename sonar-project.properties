# Configuración de SonarCloud (E12)
# Reemplazar organization/projectKey por los que muestra SonarCloud al importar el repo
# (Information -> Project key / Organization key).
sonar.organization=jonathanxuya
sonar.projectKey=jonathanxuya_conduit-qa-project
sonar.projectName=Conduit QA Project - ACS 2026

sonar.sources=backend,frontend/src
sonar.tests=backend,frontend/src
sonar.test.inclusions=**/*.test.js,**/*.test.jsx
sonar.exclusions=**/node_modules/**,**/*.test.js,**/*.test.jsx,backend/test-utils/**,backend/migrations/**,backend/seeders/**,frontend/dist/**,coverage/**,frontend/public/**

# Cobertura generada por Vitest (npm run test:coverage)
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=backend/migrations/**,backend/seeders/**,backend/models/**,backend/config/**,backend/index.js,frontend/src/main.jsx,frontend/src/reportWebVitals.js

# Duplicación: no contar los archivos de prueba
sonar.cpd.exclusions=**/*.test.js,**/*.test.jsx

# El paso del pipeline falla si el quality gate no se aprueba
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

sonar.sourceEncoding=UTF-8
